[project]
name = "regintel-backend"
version = "0.1.0"
description = "RegIntel Finance authoritative backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]==5.6.3",
  "fastapi>=0.115,<1",
  "psycopg[binary]==3.3.6",
  "pwdlib[argon2]==0.3.1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt==2.15.1",
  "pypdf==6.19.0",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.32",
  "uvicorn>=0.34,<1",
]

# M1.3 parsing is confined to the approved Linux amd64 worker. Native default
# sync and API execution omit this extra; model artifacts are acquired separately.
[project.optional-dependencies]
entities = [
  "rapidfuzz==3.14.6",
  "spacy==3.8.16",
]
publication = [
  "neo4j==6.4.0",
  "onnxruntime==1.30.0",
  "tokenizers==0.23.2",
]
parsing = [
  "docling-slim[format-pdf,models-local,feat-ocr-rapidocr-onnx]==2.134.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "docling-core==2.99.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "docling-ibm-models==4.0.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "docling-parse==7.22.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "rapidocr==3.9.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnxruntime==1.30.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # Docling's OCR base model imports scipy.ndimage; the PDF/OCR extras omit it.
  "scipy==1.18.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # Docling's PDF spatial index imports Rtree independently of optional formats.
  "rtree==1.4.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.13.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.28.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "parsing", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cpu", extra = "parsing", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

# Explicit sourcing prevents generic dependencies from using the PyTorch index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
regintel-db = "regintel.db.cli:main"
regintel-auth = "regintel.auth.cli:main"
regintel-api = "regintel.auth.cli:serve_main"
regintel-dispatch = "regintel.ingestion.cli:main"

[dependency-groups]
dev = [
  "httpx2==2.13.1",
  "mypy>=1.17,<2",
  "pillow==12.3.0",
  "pytest>=8,<10",
  "reportlab==5.0.1",
  "ruff>=0.12,<1",
  "types-reportlab==5.0.0.20260911",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regintel"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: requires an explicitly configured disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["regintel"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
